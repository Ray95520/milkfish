<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虱目魚賣貨秤重試算表</title>
    <link rel="apple-touch-icon" href="IMG_0982.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="虱目魚試算">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        /* 明亮高質感卡片 */
        .clean-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .clean-panel {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* 專屬 A4 列印樣式 */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .clean-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
        }
        .print-only {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen py-4 px-3 sm:px-6">

    <div class="max-w-md mx-auto space-y-3.5">
        
        <!-- 頂部品牌標題列（不列印） -->
        <div class="clean-card rounded-2xl px-4 py-3.5 flex items-center justify-between no-print">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-xl shadow-sm">
                    🐟
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 tracking-wide">
                        虱目魚賣貨試算
                    </h1>
                    <p class="text-[11px] text-slate-500">明亮高質感版・扣桶10斤/滿百扣5斤</p>
                </div>
            </div>
            <button onclick="resetAll()" class="text-xs font-medium text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl border border-rose-200 transition">
                清空重算
            </button>
        </div>

        <!-- 備註與匯出設定區（不列印） -->
        <div class="clean-card rounded-2xl p-4 space-y-3 no-print">
            <div class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                <span>📝</span> 對帳單備註設定
            </div>
            <div class="grid grid-cols-1 gap-2.5">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">日期</label>
                    <input type="date" id="printDate" class="w-full text-sm font-medium px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">魚塭名稱</label>
                        <input type="text" id="pondName" placeholder="例如: A區大池" class="w-full text-sm font-medium px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">魚販 / 買家</label>
                        <input type="text" id="buyerName" placeholder="例如: 陳老闆" class="w-full text-sm font-medium px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>
            <button onclick="openPrintPreview()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 active:bg-black text-white font-bold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <span>🖨️</span> 預覽並匯出 A4 對帳單報表
            </button>
        </div>

        <!-- 單桶毛重輸入區（不列印） -->
        <div class="clean-card rounded-2xl p-4 no-print">
            <div class="flex justify-between items-center mb-2">
                <label for="weightInput" class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                    <span>第</span>
                    <span id="nextBucketNum" class="inline-flex items-center justify-center px-2 py-0.5 text-base font-black text-blue-600 bg-blue-50 border border-blue-200 rounded-lg">1</span>
                    <span>桶毛重（台斤）</span>
                </label>
                <span class="text-[11px] text-blue-700 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded-md font-medium">
                    每筆自動 -10 斤
                </span>
            </div>
            <div class="flex items-stretch gap-2.5 w-full">
                <input type="number" id="weightInput" inputmode="decimal" step="0.1" min="0" placeholder="輸入台斤數..." 
                    class="flex-1 min-w-0 w-full text-xl font-bold px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 transition"
                    onkeypress="handleKeyPress(event)">
                <button onclick="addBucket()" class="shrink-0 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-base rounded-xl shadow-md transition">
                    輸入
                </button>
            </div>
        </div>

        <!-- 數據總覽四格儀表板（不列印） -->
        <div class="grid grid-cols-2 gap-2.5 no-print">
            <div class="clean-panel rounded-xl p-3">
                <div class="text-[11px] text-slate-500 font-medium">總桶數</div>
                <div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular-nums">
                    <span id="totalBuckets">0</span> <span class="text-xs font-normal text-slate-500">桶</span>
                </div>
            </div>
            <div class="clean-panel rounded-xl p-3">
                <div class="text-[11px] text-slate-500 font-medium">未扣重總毛重</div>
                <div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular-nums">
                    <span id="totalGross">0</span> <span class="text-xs font-normal text-slate-500">斤</span>
                </div>
            </div>
            <div class="clean-panel rounded-xl p-3 border-amber-200 bg-amber-50/50">
                <div class="text-[11px] text-amber-800 font-medium">扣桶重後淨重</div>
                <div class="text-xl font-extrabold text-amber-900 mt-0.5 tabular-nums">
                    <span id="netAfterBucket">0</span> <span class="text-xs font-normal text-amber-700">斤</span>
                </div>
            </div>
            <div class="clean-panel rounded-xl p-3 border-rose-200 bg-rose-50/50">
                <div class="text-[11px] text-rose-800 font-medium">滿百扣水重 (-5斤/百)</div>
                <div class="text-xl font-extrabold text-rose-700 mt-0.5 tabular-nums">
                    -<span id="waterDeduction">0</span> <span class="text-xs font-normal text-rose-600">斤</span>
                </div>
            </div>
        </div>

        <!-- 最終實算總台斤（不列印） -->
        <div class="clean-card rounded-2xl p-4 bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md flex items-center justify-between no-print">
            <div>
                <div class="text-emerald-100 text-sm font-bold tracking-wide">最終實算總台斤</div>
                <div class="text-[11px] text-emerald-200/90 mt-0.5">已扣除桶重與滿百水重</div>
            </div>
            <div class="text-3xl font-black tracking-tight tabular-nums text-white">
                <span id="finalWeight">0</span> <span class="text-sm font-medium text-emerald-100 ml-0.5">斤</span>
            </div>
        </div>

        <!-- 單價與總金額試算（不列印） -->
        <div class="clean-card rounded-2xl p-4 border-amber-300 bg-amber-50/30 space-y-3 no-print">
            <div class="flex items-center justify-between gap-3">
                <label for="priceInput" class="text-sm font-semibold text-slate-800 whitespace-nowrap flex items-center gap-1.5">
                    <span>💰</span> 每台斤單價（元）
                </label>
                <input type="number" id="priceInput" inputmode="decimal" step="0.1" min="0" placeholder="輸入單價" 
                    oninput="updateUI()"
                    class="w-32 text-right text-lg font-bold px-3 py-1.5 rounded-xl bg-white border border-amber-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-500 transition tabular-nums">
            </div>
            <div class="pt-2.5 border-t border-amber-200/60 flex items-baseline justify-between">
                <span class="text-xs font-semibold text-slate-70

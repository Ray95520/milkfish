<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虱目魚產銷試算</title>
    <link rel="apple-touch-icon" href="IMG_0982.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="虱目魚試算">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background: radial-gradient(circle at 50% 0%, #0f2942 0%, #06101e 55%, #030712 100%);
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        /* 中度深色・高級玻璃擬態漸層卡片 */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        /* A4 專屬列印排版樣式 */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            @page {
                size: A4;
                margin: 10mm;
            }
        }
        .print-only {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen py-4 px-3 sm:px-6">

    <div class="max-w-md mx-auto space-y-3.5 no-print">
        
        <!-- 頂部品牌標題列 -->
        <div class="glass-card rounded-2xl px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl overflow-hidden border border-cyan-400/35 shadow-inner shrink-0 bg-slate-900">
                    <img src="IMG_0982.jpeg" alt="虱目魚產銷試算 Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide">
                        虱目魚產銷試算
                    </h1>
                </div>
            </div>
            <button onclick="resetAll()" class="text-xs font-semibold text-rose-300 hover:text-white bg-rose-500/10 hover:bg-rose-500/20 px-3 py-1.5 rounded-xl border border-rose-500/20 transition">
                清空重算
            </button>
        </div>

        <!-- 單桶毛重輸入區與換箱按鈕 -->
        <div class="glass-card rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <label for="weightInput" class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
                    <span>第</span>
                    <span id="nextBucketNum" class="inline-flex items-center justify-center px-2 py-0.5 text-base font-black text-cyan-300 bg-cyan-500/15 border border-cyan-400/30 rounded-lg">1</span>
                    <span>桶毛重（台斤）</span>
                </label>
                <div class="flex items-center gap-2">
                    <span class="text-[11px] text-cyan-300 bg-cyan-950/60 border border-cyan-500/20 px-2 py-0.5 rounded-md font-medium">
                        目前：<strong id="currentBoxLabel" class="text-white">第一箱</strong>
                    </span>
                    <button onclick="nextBox()" class="text-[11px] font-bold text-amber-300 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 px-2.5 py-1 rounded-lg transition">
                        換下一箱 ➔
                    </button>
                </div>
            </div>
            <div class="flex items-stretch gap-2.5 w-full">
                <input type="number" id="weightInput" inputmode="decimal" step="0.1" min="0" placeholder="輸入台斤數..." 
                    class="flex-1 min-w-0 w-full text-xl font-bold px-3.5 py-2.5 rounded-xl bg-slate-950/70 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition"
                    onkeypress="handleKeyPress(event)">
                <button onclick="addBucket()" class="shrink-0 px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-base rounded-xl shadow-md transition">
                    輸入
                </button>
            </div>
        </div>

        <!-- 數據總覽四格儀表板 -->
        <div class="grid grid-cols-2 gap-2.5">
            <div class="glass-panel rounded-xl p-3">
                <div class="text-[11px] text-slate-400 font-semibold">總桶數</div>
                <div class="text-xl font-extrabold text-white mt-0.5 tabular-nums">
                    <span id="totalBuckets">0</span> <span class="text-xs font-normal text-slate-400">桶</span>
                </div>
            </div>
            <div class="glass-panel rounded-xl p-3">
                <div class="text-[11px] text-slate-400 font-semibold">未扣重總毛重</div>
                <div class="text-xl font-extrabold text-white mt-0.5 tabular-nums">
                    <span id="totalGross">0</span> <span class="text-xs font-normal text-slate-400">斤</span>
                </div>
            </div>
            <div class="glass-panel rounded-xl p-3 border-amber-500/20 bg-amber-950/15">
                <div class="text-[11px] text-amber-300 font-semibold">扣桶重後淨重</div>
                <div class="text-xl font-extrabold text-amber-300 mt-0.5 tabular-nums">
                    <span id="netAfterBucket">0</span> <span class="text-xs font-normal text-amber-400/70">斤</span>
                </div>
            </div>
            <div class="glass-panel rounded-xl p-3 border-rose-500/20 bg-rose-950/15">
                <div class="text-[11px] text-rose-300 font-semibold">水重扣除 (淨重 × 5%)</div>
                <div class="text-xl font-extrabold text-rose-400 mt-0.5 tabular-nums">
                    -<span id="waterDeduction">0</span> <span class="text-xs font-normal text-rose-400/70">斤</span>
                </div>
            </div>
        </div>

        <!-- 最終實算總台斤 -->
        <div class="glass-card rounded-2xl p-4 bg-gradient-to-r from-emerald-950/50 to-teal-950/50 border-emerald-500/30 text-white shadow-md flex items-center justify-between">
            <div>
                <div class="text-emerald-300 text-sm font-bold tracking-wide">最終實算總台斤</div>
            </div>
            <div class="text-3xl font-black tracking-tight tabular-nums text-white">
                <span id="finalWeight">0</span> <span class="text-sm font-medium text-emerald-300 ml-0.5">斤</span>
            </div>
        </div>

        <!-- 單價與總金額試算 -->
        <div class="glass-card rounded-2xl p-4 border-amber-500/30 bg-amber-950/10 space-y-3">
            <div class="flex items-center justify-between gap-3">
                <label for="priceInput" class="text-sm font-bold text-amber-200 whitespace-nowrap flex items-center gap-1.5">
                    <span>每台斤單價（元）</span>
                </label>
                <input type="number" id="priceInput" inputmode="decimal" step="0.1" min="0" placeholder="輸入單價" 
                    oninput="updateUI()"
                    class="w-32 text-right text-lg font-bold px-3 py-1.5 rounded-xl bg-slate-950/70 border border-amber-500/30 text-amber-200 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition tabular-nums">
            </div>
            <div class="pt-2.5 border-t border-white/10 flex items-baseline justify-between">
                <span class="text-xs font-bold text-slate-300 tracking-wide">預估總金額</span>
                <div class="text-2xl font-black tracking-tight tabular-nums text-amber-300">
                    <span class="text-xs font-bold mr-1 text-amber-400/80">NT$</span><span id="totalPrice">0</span>
                </div>
            </div>
        </div>

        <!-- 裝卸箱明細列表與匯出按鈕 -->
        <div class="glass-card rounded-2xl p-3.5 space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xs font-bold text-slate-300 tracking-wider">裝卸箱明細</h3>
                <span class="text-[11px] text-slate-400">點擊數字可修改/刪除</span>
            </div>
            <div id="columnListContainer" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <div class="p-4 text-center text-xs text-slate-500 glass-panel rounded-xl">尚未輸入資料，請在上方輸入第一桶毛重</div>
            </div>
            <!-- 匯出製作對帳單按鈕 -->
            <button onclick="openPrintPreview()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-cyan-500/20 transition flex items-center justify-center gap-2">
                <span>🖨️</span> 匯出製作對帳單 (A4 格式)
            </button>
        </div>

    </div>

    <!-- =================== A4 專屬磅秤單對帳列印區 (上限12箱：上6下6) =================== -->
    <div id="printArea" class="print-only bg-white text-black p-4 max-w-[210mm] mx-auto text-xs">
        <div class="text-center border-b-2 border-black pb-2 mb-3">
            <h1 class="text-lg font-black tracking-wider">仲新水產 磅秤明細對帳單</h1>
            <p class="text-[11px] mt-1 font-bold">公式：毛重-桶重*0.95</p>
        </div>

        <!-- A4 上方 6 箱表格 -->
        <div class="mb-3">
            <div id="printGridTop" class="grid grid-cols-6 gap-1 border-2 border-black p-1 bg-white">
                <!-- 動態生成上方 6 箱 -->
            </div>
        </div>

        <!-- A4 下方 6 箱表格 -->
        <div class="mb-3">
            <div id="printGridBottom" class="grid grid-cols-6 gap-1 border-2 border-black p-1 bg-white">
                <!-- 動態生成下方 6 箱 -->
            </div>
        </div>

        <!-- 底部空白保留區與結算 -->
        <div class="border-2 border-black p-3 space-y-2 mt-4">
            <div class="flex justify-between font-bold text-sm border-b border-black pb-1">
                <span>總桶數：<span id="pTotalBuckets">0</span> 桶</span>
                <span>總毛重：<span id="pTotalGross">0</span> 斤</span>
                <span>最終實算總台斤 (毛重-桶重*0.95)：<span id="pFinalWeight" class="text-base underline">0</span> 斤</span>
            </div>
            <div class="flex justify-between font-bold text-sm pt-1">
                <span>每台斤單價：NT$ <span id="pUnitPrice">0</span></span>
                <span class="text-base">預估總金額：NT$ <span id="pTotalPrice">0</span></span>
            </div>
            <div class="h-16 border border-dashed border-gray-400 mt-2 flex items-center justify-center text-gray-400 text-[11px]">
                （下方空白備註與簽名處）
            </div>
        </div>
    </div>

    <script>
        let entries = [];
        let currentBox = 0; 
        const BUCKET_TARE = 10; 

        window.onload = function() {
            const input = document.getElementById('weightInput');
            if (input) input.focus();
            updateBoxLabel();
        };

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                addBucket();
            }
        }

        function nextBox() {
            currentBox++;
            updateBoxLabel();
            const input = document.getElementById('weightInput');
            if (input) input.focus();
        }

        function updateBoxLabel() {
            const boxNames = ["第一箱", "第二箱", "第三箱", "第四箱", "第五箱", "第六箱", "第七箱", "第八箱", "第九箱", "第十箱", "第十一箱", "第十二箱"];
            const labelEl = document.getElementById('currentBoxLabel');
            if (labelEl) {
                labelEl.textContent = boxNames[currentBox] || `第 ${currentBox + 1} 箱`;
            }
        }

        function addBucket() {
            const input = document.getElementById('weightInput');
            if (!input) return;
            const val = parseFloat(input.value);

            if (isNaN(val) || val <= 0) {
                alert('請輸入大於 0 的有效台斤數！');
                input.focus();
                return;
            }

            if (val <= BUCKET_TARE) {
                if (!confirm(`輸入的重量（${val} 斤）小於或等於桶重（${BUCKET_TARE} 斤），確定要加入嗎？`)) {
                    input.focus();
                    return;
                }
            }

            entries.push({
                weight: val,
                box: currentBox
            });

            input.value = '';
            input.focus();
            updateUI();
        }

        function editBucket(index) {
            const currentVal = entries[index].weight;
            const newValStr = prompt(`修改第 ${index + 1} 桶的毛重（台斤）：`, currentVal);
            if (newValStr === null) return;
            const newVal = parseFloat(newValStr);
            if (isNaN(newVal) || newVal <= 0) {
                alert('請輸入有效的數字！');
                return;
            }
            entries[index].weight = newVal;
            updateUI();
        }

        function deleteBucket(index) {
            if (confirm(`確定要刪除第 ${index + 1} 桶（${entries[index].weight} 斤）的紀錄嗎？`)) {
                entries.splice(index, 1);
                updateUI();
            }
        }

        function resetAll() {
            if (entries.length === 0 && !document.getElementById('priceInput').value) return;
            if (confirm('確定要清空所有紀錄與單價重新計算嗎？')) {
                entries = [];
                currentBox = 0;
                document.getElementById('priceInput').value = '';
                document.getElementById('weightInput').value = '';
                updateBoxLabel();
                updateUI();
                document.getElementById('weightInput').focus();
            }
        }

        function formatNum(num) {
            return Math.round(num * 100) / 100;
        }

        function updateUI() {
            const count = entries.length;
            const nextNumEl = document.getElementById('nextBucketNum');
            const totalBucketsEl = document.getElementById('totalBuckets');
            if (nextNumEl) nextNumEl.textContent = count + 1;
            if (totalBucketsEl) totalBucketsEl.textContent = count;

            let totalGross = 0;
            let netAfterBucket = 0;

            entries.forEach(item => {
                totalGross += item.weight;
                netAfterBucket += (item.weight - BUCKET_TARE);
            });

            totalGross = formatNum(totalGross);
            netAfterBucket = formatNum(netAfterBucket);

            const finalWeight = formatNum(netAfterBucket * 0.95);
            const waterDeduction = formatNum(netAfterBucket - finalWeight);

            const priceInputEl = document.getElementById('priceInput');
            const unitPrice = priceInputEl ? parseFloat(priceInputEl.value) : 0;
            let totalPrice = 0;
            if (!isNaN(unitPrice) && unitPrice > 0 && finalWeight > 0) {
                totalPrice = Math.round(finalWeight * unitPrice);
            }

            const tgEl = document.getElementById('totalGross');
            const nabEl = document.getElementById('netAfterBucket');
            const wdEl = document.getElementById('waterDeduction');
            const fwEl = document.getElementById('finalWeight');
            const tpEl = document.getElementById('totalPrice');

            if (tgEl) tgEl.textContent = totalGross;
            if (nabEl) nabEl.textContent = netAfterBucket;
            if (wdEl) wdEl.textContent = waterDeduction;
            if (fwEl) fwEl.textContent = finalWeight;
            if (tpEl) tpEl.textContent = totalPrice.toLocaleString('zh-TW');

            // 主畫面網頁明細渲染
            const container = document.getElementById('columnListContainer');
            if (container) {
                if (count === 0) {
                    container.innerHTML = '<div class="p-4 text-center text-xs text-slate-500 glass-panel rounded-xl">尚未輸入資料，請在上方輸入第一桶毛重</div>';
                } else {
                    let boxMap = {};
                    entries.forEach((item, idx) => {
                        if (!boxMap[item.box]) boxMap[item.box] = [];
                        boxMap[item.box].push({ ...item, globalIndex: idx });
                    });

                    let boxesHTML = '';
                    let boxKeys = Object.keys(boxMap).map(Number).sort((a, b) => b - a);
                    const boxNames = ["第一箱", "第二箱", "第三箱", "第四箱", "第五箱", "第六箱", "第七箱", "第八箱", "第九箱", "第十箱", "第十一箱", "第十二箱"];

                    boxKeys.forEach(boxNum => {
                        let boxItems = boxMap[boxNum];
                        let boxGross = 0;
                        let itemsHTML = '';

                        boxItems.forEach((item) => {
                            let w = formatNum(item.weight);
                            boxGross += w;
                            itemsHTML += `
                                <div class="flex items-center justify-between py-1 px-2 rounded-lg bg-slate-900/40 border border-white/5 text-xs">
                                    <span class="text-slate-400 font-medium">第 ${item.globalIndex + 1} 桶</span>
                                    <span class="font-bold text-white tabular-nums">${w} 斤</span>
                                    <div class="space-x-1">
                                        <button onclick="editBucket(${item.globalIndex})" class="text-cyan-300 hover:text-cyan-200 px-1.5 py-0.5 rounded bg-cyan-500/15 border border-cyan-400/20 text-[11px]">改</button>
                                        <button onclick="deleteBucket(${item.globalIndex})" class="text-rose-300 hover:text-rose-200 px-1.5 py-0.5 rounded bg-rose-500/15 border border-rose-400/20 text-[11px]">刪</button>
                                    </div>
                                </div>
                            `;
                        });
                        boxGross = formatNum(boxGross);
                        let boxTitle = boxNames[boxNum] || `第 ${boxNum + 1} 箱`;

                        boxesHTML += `
                            <div class="glass-panel rounded-xl p-3 space-y-2 border border-slate-700/60">
                                <div class="flex justify-between items-center pb-1.5 border-b border-white/10">
                                    <span class="text-xs font-bold text-cyan-300">📦 ${boxTitle}</span>
                                    <span class="text-xs font-extrabold text-amber-300 tabular-nums">本箱毛重總計：${boxGross} 斤</span>
                                </div>
                                <div class="grid grid-cols-1 gap-1.5">
                                    ${itemsHTML}
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = boxesHTML;
                }
            }

            // 同步生成 A4 列印區內容 (上6下6格子排版)
            buildPrintGrid(count, totalGross, finalWeight, unitPrice, totalPrice);
        }

        function buildPrintGrid(count, totalGross, finalWeight, unitPrice, totalPrice) {
            document.getElementById('pTotalBuckets').textContent = count;
            document.getElementById('pTotalGross').textContent = totalGross;
            document.getElementById('pFinalWeight').textContent = finalWeight;
            document.getElementById('pUnitPrice').textContent = isNaN(unitPrice) ? 0 : unitPrice;
            document.getElementById('pTotalPrice').textContent = totalPrice.toLocaleString('zh-TW');

            let boxMap = {};
            entries.forEach((item, idx) => {
                if (!boxMap[item.box]) boxMap[item.box] = [];
                boxMap[item.box].push({ ...item, globalIndex: idx });
            });

            const boxNames = ["第一箱", "第二箱", "第三箱", "第四箱", "第五箱", "第六箱", "第七箱", "第八箱", "第九箱", "第十箱", "第十一箱", "第十二箱"];
            
            let topHTML = '';
            let bottomHTML = '';

            // 固定渲染 12 個欄位 (上 6 個，下 6 個)
            for (let c = 0; c < 12; c++) {
                let boxTitle = boxNames[c] || `第 ${c + 1} 箱`;
                let boxItems = boxMap[c] || [];
                let boxGross = 0;

                let rowsHTML = '';
                // 每個直欄固定預留 6 行格子
                for (let r = 0; r < 6; r++) {
                    let weightText = '';
                    if (boxItems[r]) {
                        let w = formatNum(boxItems[r].weight);
                        boxGross += w;
                        weightText = w;
                    }
                    rowsHTML += `
                        <tr class="border-b border-black text-center h-6">
                            <td class="border-r border-black w-1/3 text-[10px] text-gray-600">${weightText ? (r + 1) : ''}</td>
                            <td class="w-2/3 font-bold text-xs">${weightText}</td>
                        </tr>
                    `;
                }
                boxGross = formatNum(boxGross);

                let columnHTML = `
                    <div class="border border-black flex flex-col bg-white">
                        <div class="bg-gray-200 text-center font-bold border-b border-black py-0.5 text-[11px]">
                            ${boxTitle}
                        </div>
                        <table class="w-full border-collapse">
                            <tbody>
                                ${rowsHTML}
                            </tbody>
                        </table>
                        <div class="bg-gray-100 border-t border-black text-center py-0.5 text-[10px] font-bold">
                            毛重:${boxGross > 0 ? boxGross : ''}
                        </div>
                    </div>
                `;

                if (c < 6) {
                    topHTML += columnHTML;
                } else {
                    bottomHTML += columnHTML;
                }
            }

            document.getElementById('printGridTop').innerHTML = topHTML;
            document.getElementById('printGridBottom').innerHTML = bottomHTML;
        }

        function openPrintPreview() {
            if (entries.length === 0) {
                alert('目前沒有任何秤重資料，請先輸入至少一桶！');
                return;
            }
            updateUI();
            window.print();
        }
    </script>
</body>
</html>
